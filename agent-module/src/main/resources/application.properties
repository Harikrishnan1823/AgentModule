# App identity
spring.application.name=agent-module
server.port=8080

# H2 (or switch to MySQL in production)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Swagger (OpenAPI) path config
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# LiveKit credentials (temporary test values; replace with real ones or env variables in Render)
livekit.api-key=your_livekit_api_key
livekit.api-secret=your_livekit_api_secret
